 <!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Padrões de Cores</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎨</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #2A2F5C;
    --bg-deep: #1E2247;
    --ink: #FFFFFF;
    --muted: #C3C8EE;
    --card: #343A70;
    --card-alt: #424A8A;
    --border: #5560A8;
    --accent: #4ECDC4;
    --accent-strong: #2FA79F;
    --accent-soft: rgba(78, 205, 196, 0.38);
    --wrong: #FF9F68;
    --wrong-soft: rgba(255, 159, 104, 0.38);
    --sun: #FFD166;
    --sun-strong: #E5AE3C;

    --red: #FF0000;
    --blue: #0044FF;
    --green: #26FF00;
    --yellow: #FFEA00;
    --black: #000000;
    --purple: #8C00FF;

    --dot: 64px;
    --opt: 70px;
  }

  * { box-sizing: border-box; }

  html { font-size: 18px; }

  body {
    margin: 0;
    font-family: 'Baloo 2', 'Trebuchet MS', 'Segoe UI', sans-serif;
    background:
      radial-gradient(circle at 12% 10%, rgba(140, 0, 255, 0.28) 0, transparent 38%),
      radial-gradient(circle at 90% 88%, rgba(78, 205, 196, 0.24) 0, transparent 40%),
      linear-gradient(160deg, var(--bg) 0%, var(--bg-deep) 100%);
    background-attachment: fixed;
    color: var(--ink);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    line-height: 1.35;
  }

  .wrap { width: 100%; max-width: 720px; }

  /* ---------- Cabeçalho ---------- */
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 10px 14px;
    margin-bottom: 14px;
  }

  h1 {
    font-size: 1.9rem;
    font-weight: 800;
    margin: 0;
    letter-spacing: 0.01em;
    background: linear-gradient(90deg, #FF6B6B 0%, #FFD166 30%, #4ECDC4 60%, #B388FF 100%);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    color: transparent;
  }

  .header-right {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
  }

  .pill {
    font-weight: 800;
    font-size: 1rem;
    border-radius: 999px;
    padding: 5px 14px;
    font-variant-numeric: tabular-nums;
    box-shadow: 0 3px 0 rgba(0,0,0,0.22);
    white-space: nowrap;
  }

  .timer-badge { background: var(--sun); color: var(--bg-deep); }
  .stars-badge { background: var(--card-alt); color: var(--sun); border: 2px solid var(--border); }

  .restart-header-btn {
    font-family: inherit;
    font-weight: 700;
    font-size: 0.9rem;
    background: var(--card-alt);
    color: var(--ink);
    border: 2px solid var(--border);
    border-radius: 999px;
    padding: 5px 16px;
    cursor: pointer;
    transition: transform 0.12s ease, border-color 0.12s ease;
  }
  .restart-header-btn:hover { transform: translateY(-2px); border-color: var(--accent); }

  /* ---------- Banner do mundo + barra de progresso ---------- */
  .world-banner {
    display: flex;
    align-items: center;
    gap: 12px;
    background: var(--card);
    border: 3px solid var(--world, var(--accent));
    border-radius: 20px;
    padding: 8px 16px;
    margin-bottom: 10px;
    box-shadow: 0 5px 0 rgba(0,0,0,0.22);
    animation: popIn 0.4s ease both;
  }
  .world-banner:empty { display: none; }
  .world-emoji { font-size: 2rem; line-height: 1; }
  .world-name { font-weight: 800; font-size: 1.1rem; color: var(--world, var(--ink)); line-height: 1.1; }
  .world-sub { font-weight: 600; font-size: 0.85rem; color: var(--muted); }

  .progress-bar {
    display: flex;
    justify-content: center;
    gap: 14px;
    margin-bottom: 14px;
  }
  .progress-bar:empty { display: none; }
  .world-group { display: flex; gap: 4px; flex: 1; }
  .seg {
    flex: 1;
    height: 12px;
    border-radius: 999px;
    background: var(--card-alt);
    transition: background 0.2s ease;
  }
  .seg.done { background: var(--c); }
  .seg.current { background: var(--ink); box-shadow: 0 0 0 3px var(--c); }

  /* ---------- Cartão principal ---------- */
  .card {
    background: var(--card);
    border: 3px solid var(--border);
    border-radius: 30px;
    padding: 28px 26px 30px;
    box-shadow: 0 8px 0 rgba(0,0,0,0.22), 0 20px 40px rgba(9, 11, 26, 0.4);
  }

  /* ---------- Mascote ---------- */
  .mascot-row {
    display: flex;
    align-items: center;
    gap: 14px;
    margin-bottom: 26px;
  }
  .mascot {
    font-size: 3.2rem;
    line-height: 1;
    flex-shrink: 0;
    filter: drop-shadow(0 4px 0 rgba(0,0,0,0.25));
  }
  .mascot.happy { animation: mascotHop 0.6s ease both; }
  .mascot.sad { animation: wobble 0.6s ease both; }

  .bubble {
    position: relative;
    background: var(--ink);
    color: var(--bg-deep);
    font-weight: 700;
    font-size: 1.05rem;
    border-radius: 18px;
    padding: 10px 16px;
    box-shadow: 0 4px 0 rgba(0,0,0,0.22);
    transition: background 0.2s ease;
  }
  .bubble::before {
    content: "";
    position: absolute;
    left: -10px;
    top: 50%;
    transform: translateY(-50%);
    border: 10px solid transparent;
    border-left: 0;
    border-right-color: var(--ink);
    transition: border-right-color 0.2s ease;
  }
  .bubble.good { background: #B9F6CA; }
  .bubble.good::before { border-right-color: #B9F6CA; }
  .bubble.oops { background: #FFE0B2; }
  .bubble.oops::before { border-right-color: #FFE0B2; }

  /* ---------- Padrão e bolinhas ---------- */
  .pattern-row {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    justify-content: center;
    margin-bottom: 30px;
    padding: 18px 10px;
    background: rgba(0,0,0,0.16);
    border-radius: 22px;
    min-height: calc(var(--dot) + 36px);
  }
  .pattern-row.dense { --dot: 54px; gap: 10px; }

  .options-label, .answer-label {
    font-weight: 700;
    font-size: 1rem;
    color: var(--muted);
    text-align: center;
    margin: 0 0 14px 0;
  }

  .options-row {
    display: flex;
    gap: 18px;
    flex-wrap: wrap;
    justify-content: center;
  }

  .dot {
    width: var(--dot);
    height: var(--dot);
    border-radius: 50%;
    border: 4px solid var(--ink);
    flex-shrink: 0;
    box-shadow: 0 5px 0 rgba(0,0,0,0.28);
    transition: transform 0.15s ease;
  }

  .dot.blank { position: relative; box-shadow: none; }
  .dot.blank:not(.filled) { background: var(--card-alt); border-style: dashed; }
  .dot.blank::after {
    content: "?";
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 800;
    font-size: 1.7rem;
    color: var(--muted);
  }
  .dot.blank.filled { box-shadow: 0 5px 0 rgba(0,0,0,0.28); border-style: solid; }
  .dot.blank.filled::after { content: ""; }
  .dot.blank.pop { animation: pop 0.3s ease both; }

  .dot.blank.active {
    border-color: var(--sun);
    border-style: solid;
    box-shadow: 0 0 0 6px rgba(255, 209, 102, 0.4);
    animation: pulseGlow 1.1s ease-in-out infinite;
  }
  .dot.blank.active::after { color: var(--sun); }

  .dot.blank.correct {
    box-shadow: 0 0 0 7px var(--accent-soft), 0 5px 0 rgba(0,0,0,0.28);
    animation: hop 0.5s ease both;
  }
  .dot.blank.incorrect {
    box-shadow: 0 0 0 7px var(--wrong-soft), 0 5px 0 rgba(0,0,0,0.28);
    animation: wobble 0.5s ease both;
  }

  .dot.mini { width: 42px; height: 42px; border-width: 3px; }

  .answer-reveal { margin-top: 22px; text-align: center; }
  .answer-reveal:empty { display: none; }
  .answer-row { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }

  /* ---------- Botões de cor ---------- */
  .option {
    width: var(--opt);
    height: var(--opt);
    border-radius: 50%;
    border: 5px solid var(--ink);
    cursor: pointer;
    box-shadow: 0 6px 0 rgba(0,0,0,0.28);
    transition: transform 0.12s ease, box-shadow 0.12s ease;
    padding: 0;
  }
  .option:hover { transform: translateY(-5px) scale(1.06); }
  .option:active { transform: translateY(3px) scale(0.96); box-shadow: 0 2px 0 rgba(0,0,0,0.28); }
  .option:focus-visible, .restart-btn:focus-visible, .play-btn:focus-visible,
  .next-btn:focus-visible, .clear-btn:focus-visible, .restart-header-btn:focus-visible {
    outline: 4px solid var(--sun);
    outline-offset: 3px;
  }
  .option:disabled { cursor: default; opacity: 0.45; }

  .c-red { background: var(--red); }
  .c-blue { background: var(--blue); }
  .c-green { background: var(--green); }
  .c-yellow { background: var(--yellow); }
  .c-black { background: var(--black); }
  .c-purple { background: var(--purple); }
  .c-black { border-color: #A9B1E0; }

  /* ---------- Controles ---------- */
  .controls {
    display: flex;
    justify-content: center;
    gap: 12px;
    margin-top: 26px;
    min-height: 56px;
  }

  .next-btn, .clear-btn {
    font-family: inherit;
    font-weight: 800;
    font-size: 1.05rem;
    border: none;
    border-radius: 999px;
    padding: 11px 30px;
    cursor: pointer;
    transition: transform 0.12s ease;
  }
  .next-btn:hover, .clear-btn:hover { transform: translateY(-2px); }

  .next-btn {
    background: var(--accent);
    color: var(--bg-deep);
    box-shadow: 0 5px 0 var(--accent-strong);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.15s ease, transform 0.12s ease;
  }
  .next-btn.visible { opacity: 1; pointer-events: auto; animation: popIn 0.35s ease both; }

  .clear-btn {
    background: var(--card-alt);
    color: var(--ink);
    border: 2px solid var(--border);
    font-size: 0.95rem;
  }
  .clear-btn.hidden { display: none; }

  /* ---------- Tela final ---------- */
  .final { text-align: center; padding: 14px 6px 6px; }
  .final .mascot-row { justify-content: center; margin-bottom: 14px; }
  .final .mascot { font-size: 4.6rem; animation: mascotHop 0.9s ease both; }
  .final h2 { font-weight: 800; font-size: 1.9rem; margin: 0 0 6px; }
  .final-stars { font-size: 2.2rem; letter-spacing: 4px; margin: 4px 0 6px; }
  .final-stars .off { filter: grayscale(1); opacity: 0.35; }
  .final-score { font-weight: 800; font-size: 1.15rem; color: var(--sun); margin: 0 0 6px; }
  .final p.final-text { color: var(--muted); font-weight: 600; margin: 0 auto 22px; max-width: 460px; }

  .restart-btn, .play-btn {
    font-family: inherit;
    font-weight: 800;
    background: var(--accent);
    color: var(--bg-deep);
    border: none;
    border-radius: 999px;
    padding: 13px 34px;
    font-size: 1.1rem;
    cursor: pointer;
    box-shadow: 0 6px 0 var(--accent-strong);
    transition: transform 0.12s ease;
  }
  .restart-btn:hover, .play-btn:hover { transform: translateY(-3px); }
  .restart-btn:active, .play-btn:active { transform: translateY(2px); box-shadow: 0 3px 0 var(--accent-strong); }

  .restart-btn.secondary {
    background: var(--card-alt);
    color: var(--ink);
    border: 2px solid var(--border);
    box-shadow: 0 4px 0 rgba(0,0,0,0.22);
  }

  .final-buttons { display: flex; justify-content: center; gap: 12px; flex-wrap: wrap; }

  .times-section { margin-top: 28px; padding-top: 20px; border-top: 3px dashed var(--border); }
  .times-summary { font-weight: 800; font-size: 1rem; color: var(--sun); margin: 0 0 14px; }

  .times-list {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    text-align: left;
    max-height: 250px;
    overflow-y: auto;
    padding: 2px 4px 2px 2px;
  }
  .time-item {
    display: flex;
    justify-content: space-between;
    gap: 8px;
    font-size: 0.85rem;
    background: var(--card-alt);
    border: 2px solid var(--border);
    border-radius: 12px;
    padding: 6px 10px;
  }
  .time-item-label { color: var(--muted); font-weight: 600; }
  .time-item-value { color: var(--accent); font-weight: 800; font-variant-numeric: tabular-nums; }

  /* ---------- Tela inicial ---------- */
  .start-screen { text-align: center; padding: 10px 6px 4px; }
  .start-screen .mascot-row { justify-content: center; margin-bottom: 18px; }
  .start-screen .mascot { font-size: 4.4rem; animation: mascotHop 1.4s ease-in-out infinite; }

  .start-dots { display: flex; justify-content: center; gap: 14px; margin: 6px 0 22px; flex-wrap: wrap; }
  .start-dots .dot { width: 42px; height: 42px; animation: bob 1.6s ease-in-out infinite; }
  .start-dots .dot:nth-child(1) { animation-delay: 0s; }
  .start-dots .dot:nth-child(2) { animation-delay: 0.15s; }
  .start-dots .dot:nth-child(3) { animation-delay: 0.3s; }
  .start-dots .dot:nth-child(4) { animation-delay: 0.45s; }
  .start-dots .dot:nth-child(5) { animation-delay: 0.6s; }

  .start-screen h2 { font-weight: 800; font-size: 2rem; margin: 0 0 10px; }
  .start-screen p.start-text {
    color: var(--muted);
    font-weight: 600;
    font-size: 1.02rem;
    max-width: 460px;
    margin: 0 auto 26px;
    line-height: 1.5;
  }
  .play-btn { font-size: 1.5rem; padding: 14px 54px; letter-spacing: 0.04em; }

  /* ---------- Confete ---------- */
  .confetti { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 50; }
  .confetti span {
    position: absolute;
    top: -20px;
    width: 11px;
    height: 16px;
    border-radius: 3px;
    animation: fall linear forwards;
  }

  /* ---------- Animações ---------- */
  @keyframes pulseGlow {
    0%, 100% { box-shadow: 0 0 0 5px rgba(255, 209, 102, 0.40); }
    50%      { box-shadow: 0 0 0 11px rgba(255, 209, 102, 0.22); }
  }
  @keyframes pop {
    0%   { transform: scale(0.6); }
    70%  { transform: scale(1.15); }
    100% { transform: scale(1); }
  }
  @keyframes popIn {
    0%   { transform: scale(0.85); opacity: 0; }
    100% { transform: scale(1); opacity: 1; }
  }
  @keyframes hop {
    0%, 100% { transform: translateY(0); }
    40%      { transform: translateY(-14px); }
    70%      { transform: translateY(-3px); }
  }
  @keyframes wobble {
    0%, 100% { transform: rotate(0); }
    25%      { transform: rotate(-8deg); }
    75%      { transform: rotate(8deg); }
  }
  @keyframes mascotHop {
    0%, 100% { transform: translateY(0) rotate(0); }
    30%      { transform: translateY(-12px) rotate(-6deg); }
    60%      { transform: translateY(0) rotate(5deg); }
  }
  @keyframes bob {
    0%, 100% { transform: translateY(0); }
    50%      { transform: translateY(-12px); }
  }
  @keyframes fall {
    to { transform: translateY(110vh) rotate(720deg); }
  }

  /* ---------- Telas pequenas ---------- */
  @media (max-width: 560px) {
    html { font-size: 16px; }
    :root { --dot: 50px; --opt: 62px; }
    body { padding: 12px; align-items: flex-start; }
    .card { padding: 20px 14px 24px; border-radius: 24px; }
    .pattern-row.dense { --dot: 42px; gap: 8px; }
    .options-row { gap: 12px; }
    .times-list { grid-template-columns: repeat(2, 1fr); }
    h1 { font-size: 1.5rem; }
    .mascot { font-size: 2.6rem; }
    .start-screen .mascot { font-size: 3.6rem; }
    .final .mascot { font-size: 3.8rem; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>

<div class="wrap">
  <header>
    <h1>Padrões de Cores</h1>
    <div class="header-right" id="header-right"></div>
  </header>

  <div class="world-banner" id="world-banner"></div>
  <div class="progress-bar" id="dots-bar"></div>

  <div class="card" id="game-area"></div>
</div>

<script>
const COLORS = {
  red:    { class: 'c-red',    name: 'Vermelho' },
  blue:   { class: 'c-blue',   name: 'Azul' },
  green:  { class: 'c-green',  name: 'Verde' },
  yellow: { class: 'c-yellow', name: 'Amarelo' },
  black:  { class: 'c-black',  name: 'Preto' },
  purple: { class: 'c-purple', name: 'Roxo' }
};

const BASE_COLOR_KEYS = ['red', 'blue', 'green', 'yellow'];
const FULL_COLOR_KEYS = ['red', 'blue', 'green', 'yellow', 'black', 'purple'];

const TOTAL_ROUNDS = 20;
const ROUNDS_PER_WORLD = 5;

// Um "mundo" a cada 5 padrões: é aqui que a dificuldade sobe.
const WORLDS = [
  { emoji: '🌱', name: 'Mundo Verde',    color: '#5BE37D' },
  { emoji: '🚀', name: 'Mundo Aventura', color: '#4DB8FF' },
  { emoji: '🔮', name: 'Mundo Mágico',   color: '#C58BFF' },
  { emoji: '👑', name: 'Mundo Campeão',  color: '#FFD166' }
];

const PROMPTS = [
  'Qual cor vem agora? 🤔',
  'Descubra o padrão! 🔍',
  'Olhe bem as cores! 👀',
  'Você consegue! 💪',
  'Quais cores faltam? 🧩'
];
const CORRECT_MSGS = [
  'Isso aí! Você acertou! 🎉',
  'Muito bem! ⭐',
  'Incrível! Você é demais! 🌟',
  'Acertou em cheio! 🎯',
  'Que esperto! 🦉'
];
// Mascote: o Pipo, a corujinha
const MASCOT = '🦉';

const CONFETTI_COLORS = ['#FF4D4D', '#FFD166', '#4ECDC4', '#4DB8FF', '#C58BFF', '#5BE37D'];

let currentRound = 0;
let score = 0;
let rounds = [];

let currentAnswers = [];
let filledAnswers = [];
let activeBlankIndex = 0;
let roundFinished = false;

let timerInterval = null;
let gameStartTime = null;
let lastSplitTime = null;
let roundTimes = [];

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function pickRandom(list) {
  return list[Math.floor(Math.random() * list.length)];
}

function pickColors(n, pool) {
  return shuffle(pool).slice(0, n);
}

/* ---------------- Cronômetro (contínuo) ---------------- */

function formatTime(seconds) {
  return seconds.toFixed(1) + 's';
}

function startGameTimer() {
  clearInterval(timerInterval);
  gameStartTime = Date.now();
  lastSplitTime = gameStartTime;
  updateTimerDisplay(0);
  timerInterval = setInterval(() => {
    updateTimerDisplay((Date.now() - gameStartTime) / 1000);
  }, 100);
}

function stopGameTimer() {
  clearInterval(timerInterval);
  timerInterval = null;
}

function recordSplit() {
  const now = Date.now();
  const elapsed = (now - lastSplitTime) / 1000;
  lastSplitTime = now;
  return elapsed;
}

function updateTimerDisplay(seconds) {
  const el = document.getElementById('timer-display');
  if (el) el.textContent = '⏱️ ' + formatTime(seconds);
}

/* ---------------- Geração dos padrões ---------------- */

// Gera um padrão cíclico. Se randomPosition=false, os espaços ficam sempre
// no final da sequência. Se true, o bloco de espaços pode aparecer em
// qualquer posição (início, meio ou fim), tornando o padrão mais difícil
// de deduzir só olhando o começo.
function generatePattern(numColors, numBlanks, pool, randomPosition, repeats, optionCount) {
  const palette = pickColors(numColors, pool);
  const cycle = shuffle(palette);

  const totalLen = cycle.length * repeats;

  const sequence = [];
  for (let i = 0; i < totalLen; i++) {
    sequence.push(cycle[i % cycle.length]);
  }

  let blankStart;
  if (randomPosition) {
    blankStart = Math.floor(Math.random() * (totalLen - numBlanks + 1));
  } else {
    blankStart = totalLen - numBlanks;
  }

  const visibleBefore = sequence.slice(0, blankStart);
  const answers = sequence.slice(blankStart, blankStart + numBlanks);
  const visibleAfter = sequence.slice(blankStart + numBlanks);

  // As opções sempre incluem as cores realmente usadas no padrão (senão
  // ficaria impossível responder), completando com cores extras do pool
  // até atingir optionCount, pra servir de distração.
  let optionColors = [...palette];
  const extras = shuffle(pool.filter(c => !palette.includes(c)));
  while (optionColors.length < optionCount && extras.length) {
    optionColors.push(extras.pop());
  }
  optionColors = shuffle(optionColors);

  return { visibleBefore, visibleAfter, answers, numBlanks, optionColors };
}

function buildRounds() {
  rounds = [];
  // Padrões 1–5:   1 espaço,  2 cores, sempre no final,      4 opções
  for (let i = 0; i < 5; i++) rounds.push(generatePattern(2, 1, BASE_COLOR_KEYS, false, 6, 4));
  // Padrões 6–10:  2 espaços, 3 cores, sempre no final,      4 opções
  for (let i = 0; i < 5; i++) rounds.push(generatePattern(3, 2, BASE_COLOR_KEYS, false, 4, 4));
  // Padrões 11–15: 3 espaços, 4 cores (com preto/roxo), posição aleatória, 5 opções
  for (let i = 0; i < 5; i++) rounds.push(generatePattern(4, 3, FULL_COLOR_KEYS, true, 3, 5));
  // Padrões 16–20: 4 espaços, 5 cores (com preto/roxo), posição aleatória, 5 opções
  for (let i = 0; i < 5; i++) rounds.push(generatePattern(5, 4, FULL_COLOR_KEYS, true, 3, 5));
}

/* ---------------- Cabeçalho, mundos e progresso ---------------- */

function worldIndexOf(round) {
  return Math.min(WORLDS.length - 1, Math.floor(round / ROUNDS_PER_WORLD));
}

function renderHeaderGame() {
  const hr = document.getElementById('header-right');
  hr.innerHTML = `
    <div class="pill stars-badge" id="stars-display">⭐ ${score}</div>
    <div class="pill timer-badge" id="timer-display">⏱️ 0.0s</div>
    <button class="restart-header-btn" id="restart-header-btn">Reiniciar</button>
  `;
  document.getElementById('restart-header-btn').addEventListener('click', showStartScreen);
}

function updateStars() {
  const el = document.getElementById('stars-display');
  if (el) el.textContent = '⭐ ' + score;
}

function renderProgress() {
  const w = WORLDS[worldIndexOf(currentRound)];
  const blanks = rounds[currentRound].numBlanks;

  const banner = document.getElementById('world-banner');
  banner.style.setProperty('--world', w.color);
  banner.innerHTML = `
    <span class="world-emoji">${w.emoji}</span>
    <div>
      <div class="world-name">${w.name}</div>
      <div class="world-sub">Padrão ${currentRound + 1} de ${TOTAL_ROUNDS} · Complete ${blanks} ${blanks === 1 ? 'espaço' : 'espaços'}</div>
    </div>
  `;
  // reinicia a animação de entrada só quando muda de mundo
  banner.style.animation = 'none';
  void banner.offsetWidth;
  banner.style.animation = '';

  renderProgressBar(currentRound, false);
}

function renderProgressBar(current, allDone) {
  const bar = document.getElementById('dots-bar');
  bar.innerHTML = '';
  WORLDS.forEach((w, wi) => {
    const group = document.createElement('div');
    group.className = 'world-group';
    for (let k = 0; k < ROUNDS_PER_WORLD; k++) {
      const i = wi * ROUNDS_PER_WORLD + k;
      const seg = document.createElement('div');
      seg.className = 'seg';
      seg.style.setProperty('--c', w.color);
      if (allDone || i < current) seg.classList.add('done');
      else if (i === current) seg.classList.add('current');
      group.appendChild(seg);
    }
    bar.appendChild(group);
  });
}

/* ---------------- Mascote ---------------- */

function setMascot(text, mood) {
  const bubble = document.getElementById('mascot-text');
  const mascot = document.getElementById('mascot');
  if (!bubble || !mascot) return;
  bubble.textContent = text;
  bubble.className = 'bubble' + (mood ? ' ' + mood : '');
  mascot.textContent = MASCOT;
  mascot.className = 'mascot';
  void mascot.offsetWidth;
  if (mood === 'good') mascot.classList.add('happy');
  if (mood === 'oops') mascot.classList.add('sad');
}

function launchConfetti(count) {
  const root = document.createElement('div');
  root.className = 'confetti';
  for (let i = 0; i < count; i++) {
    const s = document.createElement('span');
    s.style.left = Math.random() * 100 + 'vw';
    s.style.background = pickRandom(CONFETTI_COLORS);
    s.style.animationDuration = (1.4 + Math.random() * 1.4) + 's';
    s.style.animationDelay = (Math.random() * 0.35) + 's';
    s.style.transform = `rotate(${Math.random() * 360}deg)`;
    root.appendChild(s);
  }
  document.body.appendChild(root);
  setTimeout(() => root.remove(), 3600);
}

/* ---------------- Rodada ---------------- */

function renderRound() {
  renderHeaderGame();

  const area = document.getElementById('game-area');
  const round = rounds[currentRound];

  currentAnswers = round.answers;
  filledAnswers = new Array(round.numBlanks).fill(null);
  activeBlankIndex = 0;
  roundFinished = false;

  const totalDots = round.visibleBefore.length + round.numBlanks + round.visibleAfter.length;
  const dense = totalDots > 10 ? ' dense' : '';

  area.innerHTML = `
    <div class="mascot-row">
      <div class="mascot" id="mascot">${MASCOT}</div>
      <div class="bubble" id="mascot-text"></div>
    </div>
    <div class="pattern-row${dense}" id="pattern-row"></div>
    <p class="options-label">Toque nas cores, na ordem certa 👇</p>
    <div class="options-row" id="options-row"></div>
    <div class="answer-reveal" id="answer-reveal"></div>
    <div class="controls">
      <button class="clear-btn hidden" id="clear-btn">🧽 Limpar</button>
      <button class="next-btn" id="next-btn">Próximo ➜</button>
    </div>
  `;

  const patternRow = document.getElementById('pattern-row');

  round.visibleBefore.forEach(color => {
    const dot = document.createElement('div');
    dot.className = `dot ${COLORS[color].class}`;
    patternRow.appendChild(dot);
  });

  for (let i = 0; i < round.numBlanks; i++) {
    const dot = document.createElement('div');
    dot.className = 'dot blank';
    dot.id = `blank-${i}`;
    if (i === 0) dot.classList.add('active');
    patternRow.appendChild(dot);
  }

  round.visibleAfter.forEach(color => {
    const dot = document.createElement('div');
    dot.className = `dot ${COLORS[color].class}`;
    patternRow.appendChild(dot);
  });

  const optionsRow = document.getElementById('options-row');
  round.optionColors.forEach(color => {
    const btn = document.createElement('button');
    btn.className = `option ${COLORS[color].class}`;
    btn.setAttribute('aria-label', COLORS[color].name);
    btn.title = COLORS[color].name;
    btn.addEventListener('click', () => handlePick(color));
    optionsRow.appendChild(btn);
  });

  document.getElementById('next-btn').addEventListener('click', goNext);
  document.getElementById('clear-btn').addEventListener('click', clearRound);

  renderProgress();

  // Mensagem do mascote: boas-vindas ao entrar num mundo novo, dicas nas demais
  if (currentRound % ROUNDS_PER_WORLD === 0) {
    const w = WORLDS[worldIndexOf(currentRound)];
    setMascot(`Bem-vindo ao ${w.name}! ${w.emoji}`, '');
  } else {
    setMascot(pickRandom(PROMPTS), '');
  }
}

function handlePick(color) {
  if (roundFinished || activeBlankIndex >= filledAnswers.length) return;

  filledAnswers[activeBlankIndex] = color;
  const blankEl = document.getElementById(`blank-${activeBlankIndex}`);
  blankEl.classList.remove('active');
  blankEl.classList.add(COLORS[color].class, 'filled', 'pop');

  document.getElementById('clear-btn').classList.remove('hidden');

  activeBlankIndex++;

  if (activeBlankIndex < filledAnswers.length) {
    document.getElementById(`blank-${activeBlankIndex}`).classList.add('active');
  } else {
    evaluateRound();
  }
}

function clearRound() {
  if (roundFinished) return;
  const round = rounds[currentRound];
  filledAnswers = new Array(round.numBlanks).fill(null);
  activeBlankIndex = 0;

  for (let i = 0; i < round.numBlanks; i++) {
    const blankEl = document.getElementById(`blank-${i}`);
    blankEl.className = 'dot blank';
    if (i === 0) blankEl.classList.add('active');
  }

  document.getElementById('clear-btn').classList.add('hidden');
  document.getElementById('answer-reveal').innerHTML = '';
  setMascot(pickRandom(PROMPTS), '');
}

function evaluateRound() {
  roundFinished = true;
  document.getElementById('clear-btn').classList.add('hidden');

  const elapsed = recordSplit();
  roundTimes[currentRound] = elapsed;

  let correctCount = 0;
  for (let i = 0; i < currentAnswers.length; i++) {
    const blankEl = document.getElementById(`blank-${i}`);
    blankEl.classList.remove('pop');
    blankEl.style.animationDelay = (i * 0.1) + 's';
    if (filledAnswers[i] === currentAnswers[i]) {
      blankEl.classList.add('correct');
      correctCount++;
    } else {
      blankEl.classList.add('incorrect');
    }
  }

  const total = currentAnswers.length;

  if (correctCount === total) {
    score++;
    updateStars();
    setMascot(pickRandom(CORRECT_MSGS), 'good');
    launchConfetti(28);
  } else {
    const msg = correctCount === 0
      ? 'Ops! Olha como era 👇 Você vai acertar o próximo!'
      : `Quase! Você acertou ${correctCount} de ${total}. Olha como era 👇`;
    setMascot(msg, 'oops');

    const reveal = document.getElementById('answer-reveal');
    reveal.innerHTML = `
      <p class="answer-label">Era assim:</p>
      <div class="answer-row" id="answer-row"></div>
    `;
    const answerRow = document.getElementById('answer-row');
    currentAnswers.forEach(color => {
      const dot = document.createElement('div');
      dot.className = `dot mini ${COLORS[color].class}`;
      answerRow.appendChild(dot);
    });
  }

  const nextBtn = document.getElementById('next-btn');
  nextBtn.textContent = currentRound === TOTAL_ROUNDS - 1 ? 'Ver meu resultado 🏆' : 'Próximo ➜';
  nextBtn.classList.add('visible');
}

function goNext() {
  currentRound++;
  if (currentRound >= TOTAL_ROUNDS) {
    renderFinal();
  } else {
    renderRound();
  }
}

/* ---------------- Tela final ---------------- */

function getFinalMessage(s) {
  const pct = s / TOTAL_ROUNDS;
  if (pct <= 0.25) {
    return {
      emoji: '🥺',
      title: 'Foi difícil, né?',
      text: 'Mas é treinando que a gente fica cada vez mais esperto. Vamos tentar de novo?'
    };
  }
  if (pct <= 0.5) {
    return {
      emoji: '😊',
      title: 'Está quase lá!',
      text: 'Você já acertou bastante! Mais uma partida e você vai ainda melhor.'
    };
  }
  if (pct <= 0.75) {
    return {
      emoji: '😄',
      title: 'Mandou bem!',
      text: 'Muito legal o seu resultado! Falta só um pouquinho para ser campeão.'
    };
  }
  return {
    emoji: '🏆',
    title: 'Você é incrível!',
    text: 'Parabéns, campeão! Você descobriu quase todos os padrões!'
  };
}

function renderFinal() {
  stopGameTimer();
  document.getElementById('header-right').innerHTML = '';
  document.getElementById('world-banner').innerHTML = '';
  renderProgressBar(TOTAL_ROUNDS, true);

  const area = document.getElementById('game-area');
  const msg = getFinalMessage(score);
  const pct = score / TOTAL_ROUNDS;

  const pipoMood = pct > 0.5 ? 'good' : (pct > 0.25 ? 'normal' : 'oops');
  const bubbleClass = pipoMood === 'good' ? ' good' : (pipoMood === 'oops' ? ' oops' : '');

  const starCount = Math.round(pct * 5);
  const starsHtml = Array.from({ length: 5 }, (_, i) =>
    `<span class="${i < starCount ? 'on' : 'off'}">⭐</span>`
  ).join('');

  const totalTime = roundTimes.reduce((sum, t) => sum + (t || 0), 0);
  const avgTime = totalTime / TOTAL_ROUNDS;

  const timesListHtml = roundTimes.map((t, i) =>
    `<div class="time-item"><span class="time-item-label">Padrão ${i + 1}</span><span class="time-item-value">${formatTime(t || 0)}</span></div>`
  ).join('');

  area.innerHTML = `
    <div class="final">
      <div class="mascot-row">
        <div class="mascot">${MASCOT}</div>
        <div class="bubble${bubbleClass}">${msg.text}</div>
      </div>
      <h2>${msg.emoji} ${msg.title}</h2>
      <div class="final-stars">${starsHtml}</div>
      <p class="final-score">Você acertou ${score} de ${TOTAL_ROUNDS} padrões!</p>
      <div class="final-buttons">
        <button class="restart-btn" id="play-again-btn">🔁 Jogar de novo</button>
        <button class="restart-btn secondary" id="back-menu-btn">🏠 Voltar ao início</button>
      </div>
      <div class="times-section">
        <p class="times-summary">Tempo total: ${formatTime(totalTime)} · Média por padrão: ${formatTime(avgTime)}</p>
        <p class="answer-label">Tempo de cada padrão</p>
        <div class="times-list">${timesListHtml}</div>
      </div>
    </div>
  `;
  document.getElementById('play-again-btn').addEventListener('click', startGame);
  document.getElementById('back-menu-btn').addEventListener('click', showStartScreen);

  if (pct > 0.75) launchConfetti(70);
  else if (pct > 0.5) launchConfetti(35);
}

/* ---------------- Início ---------------- */

function startGame() {
  currentRound = 0;
  score = 0;
  roundTimes = [];
  buildRounds();
  renderRound();
  startGameTimer();
}

function showStartScreen() {
  stopGameTimer();
  document.getElementById('header-right').innerHTML = '';
  document.getElementById('world-banner').innerHTML = '';
  document.getElementById('dots-bar').innerHTML = '';

  const previewColors = ['c-red', 'c-yellow', 'c-green', 'c-blue', 'c-purple'];

  const area = document.getElementById('game-area');
  area.innerHTML = `
    <div class="start-screen">
      <div class="mascot-row">
        <div class="mascot">${MASCOT}</div>
        <div class="bubble">Oi! Eu sou o Pipo. Vamos brincar com as cores? 🎨</div>
      </div>
      <div class="start-dots">
        ${previewColors.map(c => `<div class="dot ${c}"></div>`).join('')}
      </div>
      <h2>Treine seu olho para padrões</h2>
      <p class="start-text">Observe a sequência de cores e complete os espaços em branco na ordem certa. 20 padrões aleatórios, ficando mais difícil a cada nível, desafie sua mente.</p>
      <button class="play-btn" id="play-btn">▶ PLAY</button>
    </div>
  `;
  document.getElementById('play-btn').addEventListener('click', startGame);
}

showStartScreen();
</script>

</body>
